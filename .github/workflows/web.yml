# Flutter port (flutter_app/) jako web → GitHub Pages, hra pod /play/, kořen na ni přesměruje.
# Godot projekt se neexportuje; web dostane stejný Flutter port jako obchody.
# Nasazuje, až když je Settings → Pages → Source „GitHub Actions“ (build_type "workflow"); do té doby
# se job deploy přeskočí. Zapnout Pages rozhoduje majitel repa, ne tenhle workflow.
# Nový workflow mimo Distribution (ci/release generované odtud zůstávají beze změny).
name: Web

on:
  push:
    branches: [master]
    paths: ['flutter_app/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['flutter_app/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.x'
          channel: stable
          cache: true
      - name: Build
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter build web --release --base-href "/${{ github.event.repository.name }}/play/"
      - name: Sestavit web (hra pod /play/, kořen přesměruje)
        run: |
          mkdir -p _site/play
          cp -R flutter_app/build/web/. _site/play/
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>Fotball Simulator</title>
          <meta http-equiv="refresh" content="0; url=play/"><a href="play/">Fotball Simulator</a>
          EOF
          touch _site/.nojekyll
          test -f _site/play/index.html && test -f _site/play/main.dart.js
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages-mode:
    name: Zdroj Pages je GitHub Actions?
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      build_type: ${{ steps.mode.outputs.build_type }}
    steps:
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo none)
          echo "Pages build_type: $t"
          echo "build_type=$t" >> "$GITHUB_OUTPUT"

  deploy:
    if: needs.pages-mode.outputs.build_type == 'workflow'
    needs: [build, pages-mode]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}play/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
